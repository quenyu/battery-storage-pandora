components:
  parameters:
    battery_id:
      example: 1
      in: path
      name: battery_id
      required: true
      schema:
        format: int64
        minimum: 1
        type: integer
    operation_id:
      example: 1
      in: path
      name: operation_id
      required: true
      schema:
        format: int64
        minimum: 1
        type: integer
    user_id:
      example: 1
      in: path
      name: user_id
      required: true
      schema:
        format: int64
        minimum: 1
        type: integer
  responses:
    Error400:
      content:
        application/json:
          example:
            error:
              code: INVALID_REQUEST
              details: {}
              message: Некорректный запрос
              request_id: trace-example
          schema:
            $ref: '#/components/schemas/Error'
      description: Некорректный запрос
    Error403:
      content:
        application/json:
          example:
            error:
              code: FORBIDDEN
              details: {}
              message: Действие не разрешено
              request_id: trace-example
          schema:
            $ref: '#/components/schemas/Error'
      description: Вернуть АКБ может только её держатель
    Error404:
      content:
        application/json:
          example:
            error:
              code: RESOURCE_NOT_FOUND
              details: {}
              message: Объект не найден
              request_id: trace-example
          schema:
            $ref: '#/components/schemas/Error'
      description: Объект не найден; для ШК без активного пользователя — BARCODE_NOT_FOUND
    Error409:
      content:
        application/json:
          example:
            error:
              code: BATTERY_ALREADY_ISSUED
              details: {}
              message: Конфликт текущего состояния
              request_id: trace-example
          schema:
            $ref: '#/components/schemas/Error'
      description: Конфликт состояния или уникальности, например BATTERY_ALREADY_ISSUED, LOCATION_OCCUPIED, BARCODE_EXISTS, USER_HAS_CUSTODY
    Error413:
      content:
        application/json:
          example:
            error:
              code: PAYLOAD_TOO_LARGE
              details: {}
              message: Тело запроса слишком велико
              request_id: trace-example
          schema:
            $ref: '#/components/schemas/Error'
      description: Тело запроса слишком большое
    Error415:
      content:
        application/json:
          example:
            error:
              code: UNSUPPORTED_MEDIA_TYPE
              details: {}
              message: Требуется application/json
              request_id: trace-example
          schema:
            $ref: '#/components/schemas/Error'
      description: Ожидается application/json
    Error422:
      content:
        application/json:
          example:
            error:
              code: VALIDATION_FAILED
              details: {}
              message: Недопустимое значение
              request_id: trace-example
          schema:
            $ref: '#/components/schemas/Error'
      description: Недопустимое значение
    Error500:
      content:
        application/json:
          example:
            error:
              code: INTERNAL_ERROR
              details: {}
              message: Внутренняя ошибка
              request_id: trace-example
          schema:
            $ref: '#/components/schemas/Error'
      description: Внутренняя ошибка
    Error503:
      content:
        application/json:
          example:
            error:
              code: TEMPORARILY_UNAVAILABLE
              details: {}
              message: Временный сбой; проверьте текущее состояние перед повтором
              request_id: trace-example
          schema:
            $ref: '#/components/schemas/Error'
      description: Временный сбой; проверьте текущее состояние перед повтором
  schemas:
    Battery:
      additionalProperties: false
      properties:
        created_at:
          format: date-time
          type: string
        current_holder_user_id:
          format: int64
          nullable: true
          minimum: 1
          type: integer
        current_location:
          minLength: 1
          nullable: true
          pattern: ^1\.[1-9][0-9]*\.[1-9][0-9]*$
          type: string
        id:
          format: int64
          minimum: 1
          type: integer
        inventory_code:
          minLength: 1
          type: string
        status:
          enum:
            - STORED
            - ISSUED
          type: string
      required:
        - id
        - inventory_code
        - status
        - current_location
        - current_holder_user_id
        - created_at
      type: object
    BatteryList:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: '#/components/schemas/Battery'
          type: array
      required:
        - items
      type: object
    CommandResult:
      additionalProperties: false
      properties:
        battery:
          $ref: '#/components/schemas/Battery'
        operation:
          $ref: '#/components/schemas/Operation'
      required:
        - battery
        - operation
      type: object
    CreateUser:
      additionalProperties: false
      properties:
        barcode:
          description: Постоянный ШК карты пользователя; уникален навсегда и не меняется.
          minLength: 1
          type: string
        name:
          minLength: 1
          type: string
      required:
        - name
        - barcode
      type: object
    Error:
      additionalProperties: false
      properties:
        error:
          additionalProperties: false
          properties:
            code:
              minLength: 1
              type: string
            details:
              additionalProperties: true
              type: object
            message:
              minLength: 1
              type: string
            request_id:
              minLength: 1
              type: string
          required:
            - code
            - message
            - details
            - request_id
          type: object
      required:
        - error
      type: object
    MoveBattery:
      additionalProperties: false
      properties:
        inventory_code:
          description: Постоянный ШК конкретной АКБ; буквальный инвентарный код.
          minLength: 1
          type: string
        actor_barcode:
          minLength: 1
          type: string
        destination_location:
          minLength: 1
          pattern: ^1\.[1-9][0-9]*\.[1-9][0-9]*$
          type: string
      required:
        - inventory_code
        - actor_barcode
        - destination_location
      type: object
    Operation:
      additionalProperties: false
      properties:
        actor_user_id:
          format: int64
          minimum: 1
          type: integer
        battery_id:
          format: int64
          minimum: 1
          type: integer
        destination_location:
          minLength: 1
          nullable: true
          pattern: ^1\.[1-9][0-9]*\.[1-9][0-9]*$
          type: string
        id:
          format: int64
          minimum: 1
          type: integer
        occurred_at:
          format: date-time
          type: string
        source_location:
          minLength: 1
          nullable: true
          pattern: ^1\.[1-9][0-9]*\.[1-9][0-9]*$
          type: string
        type:
          enum:
            - STORE
            - TAKE
            - RETURN
            - MOVE
          type: string
      required:
        - id
        - battery_id
        - type
        - actor_user_id
        - source_location
        - destination_location
        - occurred_at
      type: object
    OperationList:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: '#/components/schemas/Operation'
          type: array
      required:
        - items
      type: object
    PatchUser:
      additionalProperties: false
      description: Переименование или отключение. Отключение необратимо; ШК не меняется и не переиспользуется.
      minProperties: 1
      properties:
        is_active:
          enum:
            - false
          type: boolean
        name:
          minLength: 1
          type: string
      required: []
      type: object
    ReturnBattery:
      additionalProperties: false
      properties:
        inventory_code:
          description: Постоянный ШК конкретной АКБ; буквальный инвентарный код.
          minLength: 1
          type: string
        actor_barcode:
          minLength: 1
          type: string
        destination_location:
          minLength: 1
          pattern: ^1\.[1-9][0-9]*\.[1-9][0-9]*$
          type: string
      required:
        - inventory_code
        - actor_barcode
        - destination_location
      type: object
    StoreBattery:
      additionalProperties: false
      properties:
        actor_barcode:
          minLength: 1
          type: string
        destination_location:
          minLength: 1
          pattern: ^1\.[1-9][0-9]*\.[1-9][0-9]*$
          type: string
        inventory_code:
          minLength: 1
          type: string
      required:
        - inventory_code
        - actor_barcode
        - destination_location
      type: object
    TakeBattery:
      additionalProperties: false
      properties:
        inventory_code:
          description: Постоянный ШК конкретной АКБ; буквальный инвентарный код.
          minLength: 1
          type: string
        actor_barcode:
          minLength: 1
          type: string
      required:
        - inventory_code
        - actor_barcode
      type: object
    User:
      additionalProperties: false
      properties:
        barcode:
          description: Постоянный ШК карты; уникален навсегда, в том числе после отключения.
          minLength: 1
          type: string
        created_at:
          format: date-time
          type: string
        disabled_at:
          description: Время отключения; отключение необратимо.
          format: date-time
          nullable: true
          type: string
        id:
          format: int64
          minimum: 1
          type: integer
        name:
          minLength: 1
          type: string
        updated_at:
          format: date-time
          type: string
      required:
        - id
        - barcode
        - name
        - created_at
        - updated_at
        - disabled_at
      type: object
    UserList:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: '#/components/schemas/User'
          type: array
      required:
        - items
      type: object
info:
  title: Pandora — учёт АКБ
  version: "4"
openapi: 3.0.3
paths:
  /batteries:
    get:
      operationId: listBatteries
      parameters:
        - in: query
          name: inventory_code
          schema:
            minLength: 1
            type: string
        - in: query
          name: status
          schema:
            enum:
              - STORED
              - ISSUED
            type: string
        - in: query
          name: holder_user_id
          schema:
            format: int64
            minimum: 1
            type: integer
        - in: query
          name: location
          schema:
            minLength: 1
            pattern: ^1\.[1-9][0-9]*\.[1-9][0-9]*$
            type: string
      responses:
        "200":
          content:
            application/json:
              example:
                items:
                  - created_at: "2026-09-30T09:14:00Z"
                    current_holder_user_id: null
                    current_location: 1.1.1
                    id: 1
                    inventory_code: B-00412
                    status: STORED
              schema:
                $ref: '#/components/schemas/BatteryList'
          description: Успешно
        "400":
          $ref: '#/components/responses/Error400'
        "404":
          $ref: '#/components/responses/Error404'
        "422":
          $ref: '#/components/responses/Error422'
        "500":
          $ref: '#/components/responses/Error500'
        "503":
          $ref: '#/components/responses/Error503'
      summary: Список АКБ
      tags:
        - Batteries
    post:
      operationId: storeNewBattery
      requestBody:
        content:
          application/json:
            example:
              actor_barcode: "0004097281923"
              destination_location: 1.1.1
              inventory_code: B-00412
            schema:
              $ref: '#/components/schemas/StoreBattery'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResult'
          description: Повтор последней команды тем же пользователем с теми же данными; новая операция не создаётся, возвращается прежняя
        "201":
          content:
            application/json:
              example:
                battery:
                  created_at: "2026-09-30T09:14:00Z"
                  current_holder_user_id: null
                  current_location: 1.1.1
                  id: 1
                  inventory_code: B-00412
                  status: STORED
                operation:
                  actor_user_id: 1
                  battery_id: 1
                  destination_location: 1.1.1
                  id: 1
                  occurred_at: "2026-09-30T09:14:00Z"
                  source_location: null
                  type: STORE
              schema:
                $ref: '#/components/schemas/CommandResult'
          description: Создано
          headers:
            Location:
              schema:
                type: string
        "400":
          $ref: '#/components/responses/Error400'
        "404":
          $ref: '#/components/responses/Error404'
        "409":
          $ref: '#/components/responses/Error409'
        "413":
          $ref: '#/components/responses/Error413'
        "415":
          $ref: '#/components/responses/Error415'
        "422":
          $ref: '#/components/responses/Error422'
        "500":
          $ref: '#/components/responses/Error500'
        "503":
          $ref: '#/components/responses/Error503'
      summary: Зарегистрировать и разместить АКБ
      tags:
        - Commands
  /batteries/{battery_id}:
    get:
      operationId: getBattery
      parameters:
        - $ref: '#/components/parameters/battery_id'
      responses:
        "200":
          content:
            application/json:
              example:
                created_at: "2026-09-30T09:14:00Z"
                current_holder_user_id: null
                current_location: 1.1.1
                id: 1
                inventory_code: B-00412
                status: STORED
              schema:
                $ref: '#/components/schemas/Battery'
          description: Успешно
        "400":
          $ref: '#/components/responses/Error400'
        "404":
          $ref: '#/components/responses/Error404'
        "422":
          $ref: '#/components/responses/Error422'
        "500":
          $ref: '#/components/responses/Error500'
        "503":
          $ref: '#/components/responses/Error503'
      summary: Получить АКБ по ID
      tags:
        - Batteries
  /batteries/move:
    post:
      description: Перемещение хранящейся АКБ по её постоянному ШК на другой свободный адрес.
      operationId: moveBattery
      requestBody:
        content:
          application/json:
            example:
              inventory_code: B-00412
              actor_barcode: "0004097281923"
              destination_location: 1.3.2
            schema:
              $ref: '#/components/schemas/MoveBattery'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResult'
          description: Повтор последней команды тем же пользователем с теми же данными; новая операция не создаётся, возвращается прежняя
        "201":
          content:
            application/json:
              example:
                battery:
                  created_at: "2026-09-30T09:14:00Z"
                  current_holder_user_id: null
                  current_location: 1.3.2
                  id: 1
                  inventory_code: B-00412
                  status: STORED
                operation:
                  actor_user_id: 1
                  battery_id: 1
                  destination_location: 1.3.2
                  id: 4
                  occurred_at: "2026-09-30T11:26:00Z"
                  source_location: 1.2.4
                  type: MOVE
              schema:
                $ref: '#/components/schemas/CommandResult'
          description: Создано
          headers:
            Location:
              schema:
                type: string
        "400":
          $ref: '#/components/responses/Error400'
        "404":
          $ref: '#/components/responses/Error404'
        "409":
          $ref: '#/components/responses/Error409'
        "413":
          $ref: '#/components/responses/Error413'
        "415":
          $ref: '#/components/responses/Error415'
        "422":
          $ref: '#/components/responses/Error422'
        "500":
          $ref: '#/components/responses/Error500'
        "503":
          $ref: '#/components/responses/Error503'
      summary: Переместить АКБ в другую ячейку
      tags:
        - Commands
  /batteries/return:
    post:
      description: Явный возврат текущим держателем по ШК АКБ в свободную ячейку. destination_location — сканированный адрес или настройка терминала. Уже хранящаяся АКБ даёт 409.
      operationId: returnBattery
      requestBody:
        content:
          application/json:
            example:
              inventory_code: B-00412
              actor_barcode: "0004097281923"
              destination_location: 1.2.4
            schema:
              $ref: '#/components/schemas/ReturnBattery'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResult'
          description: Повтор последней команды тем же пользователем с теми же данными; новая операция не создаётся, возвращается прежняя
        "201":
          content:
            application/json:
              example:
                battery:
                  created_at: "2026-09-30T09:14:00Z"
                  current_holder_user_id: null
                  current_location: 1.2.4
                  id: 1
                  inventory_code: B-00412
                  status: STORED
                operation:
                  actor_user_id: 1
                  battery_id: 1
                  destination_location: 1.2.4
                  id: 3
                  occurred_at: "2026-09-30T11:26:00Z"
                  source_location: null
                  type: RETURN
              schema:
                $ref: '#/components/schemas/CommandResult'
          description: Создано
          headers:
            Location:
              schema:
                type: string
        "400":
          $ref: '#/components/responses/Error400'
        "403":
          $ref: '#/components/responses/Error403'
        "404":
          $ref: '#/components/responses/Error404'
        "409":
          $ref: '#/components/responses/Error409'
        "413":
          $ref: '#/components/responses/Error413'
        "415":
          $ref: '#/components/responses/Error415'
        "422":
          $ref: '#/components/responses/Error422'
        "500":
          $ref: '#/components/responses/Error500'
        "503":
          $ref: '#/components/responses/Error503'
      summary: Вернуть выданную АКБ
      tags:
        - Commands
  /batteries/take:
    post:
      description: Явная выдача по ШК АКБ и ШК пользователя. Повтор тем же пользователем возвращает 200 и прежнюю операцию; АКБ, выданная другому, даёт 409.
      operationId: takeBattery
      requestBody:
        content:
          application/json:
            example:
              inventory_code: B-00412
              actor_barcode: "0004097281923"
            schema:
              $ref: '#/components/schemas/TakeBattery'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResult'
          description: Повтор последней команды тем же пользователем с теми же данными; новая операция не создаётся, возвращается прежняя
        "201":
          content:
            application/json:
              example:
                battery:
                  created_at: "2026-09-30T09:14:00Z"
                  current_holder_user_id: 1
                  current_location: null
                  id: 1
                  inventory_code: B-00412
                  status: ISSUED
                operation:
                  actor_user_id: 1
                  battery_id: 1
                  destination_location: null
                  id: 2
                  occurred_at: "2026-09-30T11:26:00Z"
                  source_location: 1.1.1
                  type: TAKE
              schema:
                $ref: '#/components/schemas/CommandResult'
          description: Создано
          headers:
            Location:
              schema:
                type: string
        "400":
          $ref: '#/components/responses/Error400'
        "404":
          $ref: '#/components/responses/Error404'
        "409":
          $ref: '#/components/responses/Error409'
        "413":
          $ref: '#/components/responses/Error413'
        "415":
          $ref: '#/components/responses/Error415'
        "422":
          $ref: '#/components/responses/Error422'
        "500":
          $ref: '#/components/responses/Error500'
        "503":
          $ref: '#/components/responses/Error503'
      summary: Выдать АКБ пользователю
      tags:
        - Commands
  /operations:
    get:
      operationId: listOperations
      parameters:
        - in: query
          name: battery_id
          schema:
            format: int64
            minimum: 1
            type: integer
        - in: query
          name: user_id
          schema:
            format: int64
            minimum: 1
            type: integer
        - in: query
          name: location
          schema:
            minLength: 1
            pattern: ^1\.[1-9][0-9]*\.[1-9][0-9]*$
            type: string
        - in: query
          name: type
          schema:
            enum:
              - STORE
              - TAKE
              - RETURN
              - MOVE
            type: string
        - in: query
          name: from
          schema:
            format: date-time
            type: string
        - in: query
          name: to
          schema:
            format: date-time
            type: string
      responses:
        "200":
          content:
            application/json:
              example:
                items:
                  - actor_user_id: 1
                    battery_id: 1
                    destination_location: 1.1.1
                    id: 1
                    occurred_at: "2026-09-30T09:14:00Z"
                    source_location: null
                    type: STORE
              schema:
                $ref: '#/components/schemas/OperationList'
          description: Успешно
        "400":
          $ref: '#/components/responses/Error400'
        "404":
          $ref: '#/components/responses/Error404'
        "422":
          $ref: '#/components/responses/Error422'
        "500":
          $ref: '#/components/responses/Error500'
        "503":
          $ref: '#/components/responses/Error503'
      summary: Список операций
      tags:
        - History
  /operations/{operation_id}:
    get:
      operationId: getOperation
      parameters:
        - $ref: '#/components/parameters/operation_id'
      responses:
        "200":
          content:
            application/json:
              example:
                actor_user_id: 1
                battery_id: 1
                destination_location: 1.1.1
                id: 1
                occurred_at: "2026-09-30T09:14:00Z"
                source_location: null
                type: STORE
              schema:
                $ref: '#/components/schemas/Operation'
          description: Успешно
        "400":
          $ref: '#/components/responses/Error400'
        "404":
          $ref: '#/components/responses/Error404'
        "422":
          $ref: '#/components/responses/Error422'
        "500":
          $ref: '#/components/responses/Error500'
        "503":
          $ref: '#/components/responses/Error503'
      summary: Получить операцию по ID
      tags:
        - History
  /users:
    get:
      operationId: listUsers
      parameters:
        - in: query
          name: is_active
          schema:
            type: boolean
      responses:
        "200":
          content:
            application/json:
              example:
                items:
                  - barcode: "0004097281923"
                    created_at: "2026-09-30T09:14:00Z"
                    disabled_at: null
                    id: 1
                    name: Иван Петров
                    updated_at: "2026-09-30T09:14:00Z"
              schema:
                $ref: '#/components/schemas/UserList'
          description: Успешно
        "400":
          $ref: '#/components/responses/Error400'
        "404":
          $ref: '#/components/responses/Error404'
        "422":
