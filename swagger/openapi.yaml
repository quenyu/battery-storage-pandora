components:
  parameters:
    battery_id:
      example: 00000000-0000-4000-8000-000000000412
      in: path
      name: battery_id
      required: true
      schema:
        format: uuid
        type: string
    credential_id:
      example: 00000000-0000-4000-8000-000000000138
      in: path
      name: credential_id
      required: true
      schema:
        format: uuid
        type: string
    employee_id:
      example: 00000000-0000-4000-8000-000000000137
      in: path
      name: employee_id
      required: true
      schema:
        format: uuid
        type: string
    operation_id:
      example: 00000000-0000-4000-8000-000000000901
      in: path
      name: operation_id
      required: true
      schema:
        format: uuid
        type: string
  responses:
    Error400:
      content:
        application/json:
          example:
            error:
              code: INVALID_REQUEST
              details: {}
              message: Некорректный запрос
              request_id: trace-example
          schema:
            $ref: '#/components/schemas/Error'
      description: Некорректный запрос
    Error403:
      content:
        application/json:
          example:
            error:
              code: FORBIDDEN
              details: {}
              message: Действие не разрешено
              request_id: trace-example
          schema:
            $ref: '#/components/schemas/Error'
      description: Сотрудник или карта отключены; возврат разрешён только держателю
    Error404:
      content:
        application/json:
          example:
            error:
              code: RESOURCE_NOT_FOUND
              details: {}
              message: Объект не найден
              request_id: trace-example
          schema:
            $ref: '#/components/schemas/Error'
      description: Объект не найден
    Error409:
      content:
        application/json:
          example:
            error:
              code: BATTERY_ALREADY_ISSUED
              details: {}
              message: Конфликт текущего состояния
              request_id: trace-example
          schema:
            $ref: '#/components/schemas/Error'
      description: Конфликт состояния
    Error413:
      content:
        application/json:
          example:
            error:
              code: PAYLOAD_TOO_LARGE
              details: {}
              message: Тело запроса слишком велико
              request_id: trace-example
          schema:
            $ref: '#/components/schemas/Error'
      description: Тело запроса слишком большое
    Error415:
      content:
        application/json:
          example:
            error:
              code: UNSUPPORTED_MEDIA_TYPE
              details: {}
              message: Требуется application/json
              request_id: trace-example
          schema:
            $ref: '#/components/schemas/Error'
      description: Ожидается application/json
    Error422:
      content:
        application/json:
          example:
            error:
              code: VALIDATION_FAILED
              details: {}
              message: Недопустимое значение
              request_id: trace-example
          schema:
            $ref: '#/components/schemas/Error'
      description: Недопустимое значение
    Error500:
      content:
        application/json:
          example:
            error:
              code: INTERNAL_ERROR
              details: {}
              message: Внутренняя ошибка
              request_id: trace-example
          schema:
            $ref: '#/components/schemas/Error'
      description: Внутренняя ошибка
    Error503:
      content:
        application/json:
          example:
            error:
              code: TEMPORARILY_UNAVAILABLE
              details: {}
              message: Временный сбой; проверьте текущее состояние перед повтором
              request_id: trace-example
          schema:
            $ref: '#/components/schemas/Error'
      description: Временный сбой; проверьте текущее состояние перед повтором
  schemas:
    Battery:
      additionalProperties: false
      properties:
        created_at:
          format: date-time
          type: string
        current_holder_employee_id:
          format: uuid
          nullable: true
          type: string
        current_location:
          minLength: 1
          nullable: true
          pattern: ^[1-9][0-9]*\.[1-9][0-9]*\.[1-9][0-9]*$
          type: string
        id:
          format: uuid
          type: string
        inventory_code:
          minLength: 1
          type: string
        serial_number:
          nullable: true
          type: string
        status:
          enum:
            - STORED
            - ISSUED
          type: string
        updated_at:
          format: date-time
          type: string
        version:
          format: int64
          minimum: 1
          type: integer
      required:
        - id
        - inventory_code
        - serial_number
        - status
        - current_location
        - current_holder_employee_id
        - version
        - created_at
        - updated_at
      type: object
    BatteryList:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: '#/components/schemas/Battery'
          type: array
      required:
        - items
      type: object
    CommandResult:
      additionalProperties: false
      properties:
        battery:
          $ref: '#/components/schemas/Battery'
        operation:
          $ref: '#/components/schemas/Operation'
      required:
        - battery
        - operation
      type: object
    CreateCredential:
      additionalProperties: false
      description: У сотрудника может быть только одна активная личная карта. Для замены укажите ID текущей активной карты; после её отдельного отключения можно создать новую без replaces_credential_id. ШК нельзя передать другому сотруднику, даже после отключения карты.
      properties:
        replaces_credential_id:
          description: ID заменяемой карты этого сотрудника. Если активная карта уже есть, нужно указать именно её. Отключение старой и создание новой выполняются атомарно.
          format: uuid
          type: string
        value:
          minLength: 1
          type: string
      required:
        - value
      type: object
    CreateEmployee:
      additionalProperties: false
      properties:
        display_name:
          minLength: 1
          type: string
        personnel_number:
          minLength: 1
          type: string
      required:
        - display_name
      type: object
    Credential:
      additionalProperties: false
      properties:
        created_at:
          format: date-time
          type: string
        disabled_at:
          format: date-time
          nullable: true
          type: string
        employee_id:
          format: uuid
          type: string
        id:
          format: uuid
          type: string
        is_active:
          type: boolean
        updated_at:
          format: date-time
          type: string
        value:
          minLength: 1
          type: string
      required:
        - id
        - is_active
        - created_at
        - updated_at
        - disabled_at
        - employee_id
        - value
      type: object
    CredentialList:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: '#/components/schemas/Credential'
          type: array
      required:
        - items
      type: object
    CredentialResolution:
      additionalProperties: false
      properties:
        credential_id:
          format: uuid
          type: string
        employee:
          $ref: '#/components/schemas/Employee'
      required:
        - employee
        - credential_id
      type: object
    DisableCredential:
      additionalProperties: false
      properties:
        is_active:
          enum:
            - false
          type: boolean
      required:
        - is_active
      type: object
    Employee:
      additionalProperties: false
      properties:
        created_at:
          format: date-time
          type: string
        disabled_at:
          format: date-time
          nullable: true
          type: string
        display_name:
          minLength: 1
          type: string
        id:
          format: uuid
          type: string
        is_active:
          type: boolean
        personnel_number:
          nullable: true
          type: string
        updated_at:
          format: date-time
          type: string
      required:
        - id
        - is_active
        - created_at
        - updated_at
        - disabled_at
        - display_name
        - personnel_number
      type: object
    EmployeeList:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: '#/components/schemas/Employee'
          type: array
      required:
        - items
      type: object
    Error:
      additionalProperties: false
      properties:
        error:
          additionalProperties: false
          properties:
            code:
              minLength: 1
              type: string
            details:
              additionalProperties: true
              type: object
            message:
              minLength: 1
              type: string
            request_id:
              minLength: 1
              type: string
          required:
            - code
            - message
            - details
            - request_id
          type: object
      required:
        - error
      type: object
    MoveBattery:
      additionalProperties: false
      properties:
        inventory_code:
          description: Постоянный ШК конкретной АКБ; буквальный инвентарный код.
          minLength: 1
          type: string
        actor_credential_value:
          minLength: 1
          type: string
        destination_location:
          minLength: 1
          pattern: ^[1-9][0-9]*\.[1-9][0-9]*\.[1-9][0-9]*$
          type: string
        expected_version:
          format: int64
          minimum: 1
          type: integer
        observed_source_location:
          minLength: 1
          pattern: ^[1-9][0-9]*\.[1-9][0-9]*\.[1-9][0-9]*$
          type: string
      required:
        - inventory_code
        - actor_credential_value
        - destination_location
      type: object
    Operation:
      additionalProperties: false
      properties:
        actor_employee_id:
          format: uuid
          type: string
        battery_id:
          format: uuid
          type: string
        battery_version:
          format: int64
          minimum: 1
          type: integer
        credential_id:
          format: uuid
          type: string
        destination_holder_employee_id:
          format: uuid
          nullable: true
          type: string
        destination_location:
          minLength: 1
          nullable: true
          pattern: ^[1-9][0-9]*\.[1-9][0-9]*\.[1-9][0-9]*$
          type: string
        destination_status:
          enum:
            - STORED
            - ISSUED
          type: string
        id:
          format: uuid
          type: string
        occurred_at:
          format: date-time
          type: string
        source_holder_employee_id:
          format: uuid
          nullable: true
          type: string
        source_location:
          minLength: 1
          nullable: true
          pattern: ^[1-9][0-9]*\.[1-9][0-9]*\.[1-9][0-9]*$
          type: string
        source_status:
          enum:
            - STORED
            - ISSUED
            - null
          nullable: true
          type: string
        type:
          enum:
            - STORE
            - TAKE
            - RETURN
            - MOVE
          type: string
      required:
        - id
        - battery_id
        - battery_version
        - type
        - actor_employee_id
        - credential_id
        - source_status
        - destination_status
        - source_location
        - destination_location
        - source_holder_employee_id
        - destination_holder_employee_id
        - occurred_at
      type: object
    OperationList:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: '#/components/schemas/Operation'
          type: array
      required:
        - items
      type: object
    PatchEmployee:
      additionalProperties: false
      minProperties: 1
      properties:
        display_name:
          minLength: 1
          type: string
        is_active:
          type: boolean
      required: []
      type: object
    ResolveCredential:
      additionalProperties: false
      properties:
        credential_value:
          minLength: 1
          type: string
      required:
        - credential_value
      type: object
    ReturnBattery:
      additionalProperties: false
      properties:
        inventory_code:
          description: Постоянный ШК конкретной АКБ; буквальный инвентарный код.
          minLength: 1
          type: string
        actor_credential_value:
          minLength: 1
          type: string
        destination_location:
          minLength: 1
          pattern: ^[1-9][0-9]*\.[1-9][0-9]*\.[1-9][0-9]*$
          type: string
        expected_version:
          format: int64
          minimum: 1
          type: integer
      required:
        - inventory_code
        - actor_credential_value
        - destination_location
      type: object
    StoreBattery:
      additionalProperties: false
      properties:
        actor_credential_value:
          minLength: 1
          type: string
        destination_location:
          minLength: 1
          pattern: ^[1-9][0-9]*\.[1-9][0-9]*\.[1-9][0-9]*$
          type: string
        inventory_code:
          minLength: 1
          type: string
        serial_number:
          minLength: 1
          type: string
      required:
        - inventory_code
        - actor_credential_value
        - destination_location
      type: object
    TakeBattery:
      additionalProperties: false
      properties:
        inventory_code:
          description: Постоянный ШК конкретной АКБ; буквальный инвентарный код.
          minLength: 1
          type: string
        actor_credential_value:
          minLength: 1
          type: string
        expected_version:
          format: int64
          minimum: 1
          type: integer
        observed_source_location:
          minLength: 1
          pattern: ^[1-9][0-9]*\.[1-9][0-9]*\.[1-9][0-9]*$
          type: string
      required:
        - inventory_code
        - actor_credential_value
      type: object
info:
  title: Pandora — учёт АКБ
  version: "2"
openapi: 3.0.3
paths:
  /batteries:
    get:
      operationId: listBatteries
      parameters:
        - in: query
          name: inventory_code
          schema:
            minLength: 1
            type: string
        - in: query
          name: status
          schema:
            enum:
              - STORED
              - ISSUED
            type: string
        - in: query
          name: holder_employee_id
          schema:
            format: uuid
            type: string
        - in: query
          name: location
          schema:
            minLength: 1
            pattern: ^[1-9][0-9]*\.[1-9][0-9]*\.[1-9][0-9]*$
            type: string
      responses:
        "200":
          content:
            application/json:
              example:
                items:
                  - created_at: "2026-09-30T09:14:00Z"
                    current_holder_employee_id: null
                    current_location: 1.1.1
                    id: 00000000-0000-4000-8000-000000000412
                    inventory_code: B-00412
                    serial_number: null
                    status: STORED
                    updated_at: "2026-09-30T09:14:00Z"
                    version: 1
              schema:
                $ref: '#/components/schemas/BatteryList'
          description: Успешно
        "400":
          $ref: '#/components/responses/Error400'
        "404":
          $ref: '#/components/responses/Error404'
        "422":
          $ref: '#/components/responses/Error422'
        "500":
          $ref: '#/components/responses/Error500'
        "503":
          $ref: '#/components/responses/Error503'
      summary: Поиск и текущие состояния
      tags:
        - Batteries
    post:
      operationId: storeNewBattery
      requestBody:
        content:
          application/json:
            example:
              actor_credential_value: "0004097281923"
              destination_location: 1.1.1
              inventory_code: B-00412
            schema:
              $ref: '#/components/schemas/StoreBattery'
        required: true
      responses:
        "201":
          content:
            application/json:
              example:
                battery:
                  created_at: "2026-09-30T09:14:00Z"
                  current_holder_employee_id: null
                  current_location: 1.1.1
                  id: 00000000-0000-4000-8000-000000000412
                  inventory_code: B-00412
                  serial_number: null
                  status: STORED
                  updated_at: "2026-09-30T09:14:00Z"
                  version: 1
                operation:
                  actor_employee_id: 00000000-0000-4000-8000-000000000137
                  battery_id: 00000000-0000-4000-8000-000000000412
                  battery_version: 1
                  credential_id: 00000000-0000-4000-8000-000000000138
                  destination_holder_employee_id: null
                  destination_location: 1.1.1
                  destination_status: STORED
                  id: 00000000-0000-4000-8000-000000000901
                  occurred_at: "2026-09-30T09:14:00Z"
                  source_holder_employee_id: null
                  source_location: null
                  source_status: null
                  type: STORE
              schema:
                $ref: '#/components/schemas/CommandResult'
          description: Создано
          headers:
            Location:
              schema:
                type: string
        "400":
          $ref: '#/components/responses/Error400'
        "403":
          $ref: '#/components/responses/Error403'
        "404":
          $ref: '#/components/responses/Error404'
        "409":
          $ref: '#/components/responses/Error409'
        "413":
          $ref: '#/components/responses/Error413'
        "415":
          $ref: '#/components/responses/Error415'
        "422":
          $ref: '#/components/responses/Error422'
        "500":
          $ref: '#/components/responses/Error500'
        "503":
          $ref: '#/components/responses/Error503'
      summary: Зарегистрировать и разместить АКБ
      tags:
        - Commands
  /batteries/{battery_id}:
    get:
      operationId: getBattery
      parameters:
        - $ref: '#/components/parameters/battery_id'
      responses:
        "200":
          content:
            application/json:
              example:
                created_at: "2026-09-30T09:14:00Z"
                current_holder_employee_id: null
                current_location: 1.1.1
                id: 00000000-0000-4000-8000-000000000412
                inventory_code: B-00412
                serial_number: null
                status: STORED
                updated_at: "2026-09-30T09:14:00Z"
                version: 1
              schema:
                $ref: '#/components/schemas/Battery'
          description: Успешно
        "400":
          $ref: '#/components/responses/Error400'
        "404":
          $ref: '#/components/responses/Error404'
        "422":
          $ref: '#/components/responses/Error422'
        "500":
          $ref: '#/components/responses/Error500'
        "503":
          $ref: '#/components/responses/Error503'
      summary: Текущее состояние АКБ
      tags:
        - Batteries
  /batteries/move:
    post:
      description: Перемещение хранящейся АКБ по её постоянному ШК на другой свободный адрес.
      operationId: moveBattery
      requestBody:
        content:
          application/json:
            example:
              inventory_code: B-00412
              actor_credential_value: "0004097281923"
              destination_location: 2.1.2
              expected_version: 3
              observed_source_location: 1.2.4
            schema:
              $ref: '#/components/schemas/MoveBattery'
        required: true
      responses:
        "201":
          content:
            application/json:
              example:
                battery:
                  created_at: "2026-09-30T09:14:00Z"
                  current_holder_employee_id: null
                  current_location: 2.1.2
                  id: 00000000-0000-4000-8000-000000000412
                  inventory_code: B-00412
                  serial_number: null
                  status: STORED
                  updated_at: "2026-09-30T11:26:00Z"
                  version: 4
                operation:
                  actor_employee_id: 00000000-0000-4000-8000-000000000137
                  battery_id: 00000000-0000-4000-8000-000000000412
                  battery_version: 4
                  credential_id: 00000000-0000-4000-8000-000000000138
                  destination_holder_employee_id: null
                  destination_location: 2.1.2
                  destination_status: STORED
                  id: 00000000-0000-4000-8000-000000000904
                  occurred_at: "2026-09-30T11:26:00Z"
                  source_holder_employee_id: null
                  source_location: 1.2.4
                  source_status: STORED
                  type: MOVE
              schema:
                $ref: '#/components/schemas/CommandResult'
          description: Создано
          headers:
            Location:
              schema:
                type: string
        "400":
          $ref: '#/components/responses/Error400'
        "403":
          $ref: '#/components/responses/Error403'
        "404":
          $ref: '#/components/responses/Error404'
        "409":
          $ref: '#/components/responses/Error409'
        "413":
          $ref: '#/components/responses/Error413'
        "415":
          $ref: '#/components/responses/Error415'
        "422":
          $ref: '#/components/responses/Error422'
        "500":
          $ref: '#/components/responses/Error500'
        "503":
          $ref: '#/components/responses/Error503'
      summary: Переместить между ячейками
      tags:
        - Commands
  /batteries/{battery_id}/operations:
    get:
      operationId: listBatteryOperations
      parameters:
        - $ref: '#/components/parameters/battery_id'
      responses:
        "200":
          content:
            application/json:
              example:
                items:
                  - actor_employee_id: 00000000-0000-4000-8000-000000000137
                    battery_id: 00000000-0000-4000-8000-000000000412
                    battery_version: 1
                    credential_id: 00000000-0000-4000-8000-000000000138
                    destination_holder_employee_id: null
                    destination_location: 1.1.1
                    destination_status: STORED
                    id: 00000000-0000-4000-8000-000000000901
                    occurred_at: "2026-09-30T09:14:00Z"
                    source_holder_employee_id: null
                    source_location: null
                    source_status: null
                    type: STORE
              schema:
                $ref: '#/components/schemas/OperationList'
          description: Успешно
        "400":
          $ref: '#/components/responses/Error400'
        "404":
          $ref: '#/components/responses/Error404'
        "422":
          $ref: '#/components/responses/Error422'
        "500":
          $ref: '#/components/responses/Error500'
        "503":
          $ref: '#/components/responses/Error503'
      summary: История АКБ по версии
      tags:
        - History
  /batteries/return:
    post:
      description: Явный возврат текущим держателем по ШК АКБ в свободную ячейку. destination_location — сканированный адрес или настройка терминала. Уже хранящаяся АКБ даёт 409.
      operationId: returnBattery
      requestBody:
        content:
          application/json:
            example:
              inventory_code: B-00412
              actor_credential_value: "0004097281923"
              destination_location: 1.2.4
              expected_version: 2
            schema:
              $ref: '#/components/schemas/ReturnBattery'
        required: true
      responses:
        "201":
          content:
            application/json:
              example:
                battery:
                  created_at: "2026-09-30T09:14:00Z"
                  current_holder_employee_id: null
                  current_location: 1.2.4
                  id: 00000000-0000-4000-8000-000000000412
                  inventory_code: B-00412
                  serial_number: null
                  status: STORED
                  updated_at: "2026-09-30T11:26:00Z"
                  version: 3
                operation:
                  actor_employee_id: 00000000-0000-4000-8000-000000000137
                  battery_id: 00000000-0000-4000-8000-000000000412
                  battery_version: 3
                  credential_id: 00000000-0000-4000-8000-000000000138
                  destination_holder_employee_id: null
                  destination_location: 1.2.4
                  destination_status: STORED
                  id: 00000000-0000-4000-8000-000000000903
                  occurred_at: "2026-09-30T11:26:00Z"
                  source_holder_employee_id: 00000000-0000-4000-8000-000000000137
                  source_location: null
                  source_status: ISSUED
                  type: RETURN
              schema:
                $ref: '#/components/schemas/CommandResult'
          description: Создано
          headers:
            Location:
              schema:
                type: string
        "400":
          $ref: '#/components/responses/Error400'
        "403":
          $ref: '#/components/responses/Error403'
        "404":
          $ref: '#/components/responses/Error404'
        "409":
