openapi: 3.0.3
info:
  title: Pandora — проект API демонстрационного макета АКБ
  version: 1.0.0
  description: Целевой контракт, не текущий API прежнего прототипа. Одна АКБ на ячейку; STORE/TAKE/RETURN/MOVE;
    берёт и возвращает сам. Без входа/ролей, условный credential не подтверждает личность. Изменяющие POST требуют
    глобальный Idempotency-Key; resolve — чтение без ключа. UUID в lower case. Коды сохраняются буквально, name
    trim. Тело не более 64 KiB; неизвестные/повторные поля и null запрещены; query изменяющих команд запрещён. Списки
    по UUID ASC, история по времени DESC/id DESC, история АКБ по версии DESC. Nullable поля ответов всегда присутствуют.
    Примеры маршрутов независимы. Swagger UI подключается к этому файлу при будущей реализации.
servers:
- url: /api/v1
  description: Будущий backend макета на том же origin; текущий прототип может отличаться.
tags:
- name: Сотрудники
- name: Хранение
- name: Учёт
- name: История
paths:
  /employees:
    post:
      operationId: createEmployee
      tags:
      - Сотрудники
      summary: Создать сотрудника и первый credential
      description: Создать сотрудника и первый credential Повтор с прежним ключом возвращает сохранённые статус
        и JSON без нового изменения. Ошибки ключ не сохраняют.
      responses:
        '201':
          description: Сохранённый результат команды; при повторе может быть историческим.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employee'
              example:
                id: 00000000-0000-4000-8000-000000000001
                name: Иван Петров
                created_at: '2026-09-29T10:00:00Z'
                disabled_at: null
        '400':
          $ref: '#/components/responses/Error400'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '413':
          $ref: '#/components/responses/Error413'
        '415':
          $ref: '#/components/responses/Error415'
        '422':
          $ref: '#/components/responses/Error422'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEmployee'
            example:
              name: Иван Петров
              credential_value: '00001234'
    get:
      operationId: listEmployees
      tags:
      - Сотрудники
      summary: Список сотрудников
      description: Список сотрудников
      responses:
        '200':
          description: Успешное чтение.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeePage'
              example:
                items:
                - id: 00000000-0000-4000-8000-000000000001
                  name: Иван Петров
                  created_at: '2026-09-29T10:00:00Z'
                  disabled_at: null
                limit: 50
                offset: 0
        '400':
          $ref: '#/components/responses/Error400'
        '404':
          $ref: '#/components/responses/Error404'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
  /employees/{employee_id}:
    get:
      operationId: getEmployee
      tags:
      - Сотрудники
      summary: Получить сотрудника
      description: Получить сотрудника
      responses:
        '200':
          description: Успешное чтение.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employee'
              example:
                id: 00000000-0000-4000-8000-000000000001
                name: Иван Петров
                created_at: '2026-09-29T10:00:00Z'
                disabled_at: null
        '400':
          $ref: '#/components/responses/Error400'
        '404':
          $ref: '#/components/responses/Error404'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
      parameters:
      - name: employee_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /credentials/resolve:
    post:
      operationId: resolveCredential
      tags:
      - Сотрудники
      summary: Определить сотрудника по коду
      description: Чтение без изменений и без Idempotency-Key. Неизвестный или отозванный код, отключённый сотрудник
        — 404 CREDENTIAL_NOT_FOUND. Не создаёт человека автоматически.
      responses:
        '200':
          description: Успешное чтение.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialResolution'
              example:
                employee_id: 00000000-0000-4000-8000-000000000001
                credential_id: 00000000-0000-4000-8000-000000000002
                name: Иван Петров
        '400':
          $ref: '#/components/responses/Error400'
        '404':
          $ref: '#/components/responses/Error404'
        '413':
          $ref: '#/components/responses/Error413'
        '415':
          $ref: '#/components/responses/Error415'
        '422':
          $ref: '#/components/responses/Error422'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveCredential'
            example:
              value: '00001234'
  /employees/{employee_id}/credentials:
    get:
      operationId: listCredentials
      tags:
      - Сотрудники
      summary: Коды сотрудника, включая отозванные
      description: Коды сотрудника, включая отозванные
      responses:
        '200':
          description: Успешное чтение.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialPage'
              example:
                items:
                - id: 00000000-0000-4000-8000-000000000002
                  employee_id: 00000000-0000-4000-8000-000000000001
                  value: '00001234'
                  created_at: '2026-09-29T10:00:00Z'
                  revoked_at: null
                limit: 50
                offset: 0
        '400':
          $ref: '#/components/responses/Error400'
        '404':
          $ref: '#/components/responses/Error404'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
      parameters:
      - name: employee_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
    post:
      operationId: addCredential
      tags:
      - Сотрудники
      summary: Добавить или атомарно заменить credential
      description: При replaces_credential_id старый код этого сотрудника отзывается в той же транзакции. Чужой
        ID — 404; отозванный — 409 CREDENTIAL_REVOKED; совпадение значения с любым старым — 409 CREDENTIAL_EXISTS.
        Отключённый сотрудник — 409 EMPLOYEE_DISABLED. Повтор с прежним ключом возвращает сохранённые статус и JSON
        без нового изменения. Ошибки ключ не сохраняют.
      responses:
        '201':
          description: Сохранённый результат команды; при повторе может быть историческим.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Credential'
              example:
                id: 00000000-0000-4000-8000-000000000009
                employee_id: 00000000-0000-4000-8000-000000000001
                value: 00005678
                created_at: '2026-09-29T10:00:00Z'
                revoked_at: null
        '400':
          $ref: '#/components/responses/Error400'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '413':
          $ref: '#/components/responses/Error413'
        '415':
          $ref: '#/components/responses/Error415'
        '422':
          $ref: '#/components/responses/Error422'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
      parameters:
      - name: employee_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddCredential'
            example:
              value: 00005678
              replaces_credential_id: 00000000-0000-4000-8000-000000000002
  /credentials/{credential_id}/revoke:
    post:
      operationId: revokeCredential
      tags:
      - Сотрудники
      summary: Отозвать credential
      description: Без тела запроса. Повторный отзыв с новым ключом возвращает 200 без изменения revoked_at. Повтор
        с прежним ключом возвращает сохранённые статус и JSON без нового изменения. Ошибки ключ не сохраняют.
      responses:
        '200':
          description: Сохранённый результат команды; при повторе может быть историческим.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Credential'
              example:
                id: 00000000-0000-4000-8000-000000000002
                employee_id: 00000000-0000-4000-8000-000000000001
                value: '00001234'
                created_at: '2026-09-29T10:00:00Z'
                revoked_at: '2026-09-29T10:00:00Z'
        '400':
          $ref: '#/components/responses/Error400'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '413':
          $ref: '#/components/responses/Error413'
        '415':
          $ref: '#/components/responses/Error415'
        '422':
          $ref: '#/components/responses/Error422'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
      parameters:
      - name: credential_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IdempotencyKey'
  /cabinets:
    post:
      operationId: createCabinet
      tags:
      - Хранение
      summary: Создать шкаф
      description: Номер уникален внутри родителя (шкафа — глобально). Родитель должен существовать и быть активным;
        для ячейки активен и шкаф. Повтор с прежним ключом возвращает сохранённые статус и JSON без нового изменения.
        Ошибки ключ не сохраняют.
      responses:
        '201':
          description: Сохранённый результат команды; при повторе может быть историческим.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cabinet'
              example:
                id: 00000000-0000-4000-8000-000000000003
                number: 1
                created_at: '2026-09-29T10:00:00Z'
                disabled_at: null
        '400':
          $ref: '#/components/responses/Error400'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '413':
          $ref: '#/components/responses/Error413'
        '415':
          $ref: '#/components/responses/Error415'
        '422':
          $ref: '#/components/responses/Error422'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateNumber'
            example:
              number: 1
    get:
      operationId: listCabinets
      tags:
      - Хранение
      summary: 'Список: шкаф'
      description: 'Список: шкаф'
      responses:
        '200':
          description: Успешное чтение.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CabinetPage'
              example:
                items:
                - id: 00000000-0000-4000-8000-000000000003
                  number: 1
                  created_at: '2026-09-29T10:00:00Z'
                  disabled_at: null
                limit: 50
                offset: 0
        '400':
          $ref: '#/components/responses/Error400'
        '404':
          $ref: '#/components/responses/Error404'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
  /cabinets/{cabinet_id}/shelves:
    post:
      operationId: createShelf
      tags:
      - Хранение
      summary: Создать полку
      description: Номер уникален внутри родителя (шкафа — глобально). Родитель должен существовать и быть активным;
        для ячейки активен и шкаф. Повтор с прежним ключом возвращает сохранённые статус и JSON без нового изменения.
        Ошибки ключ не сохраняют.
      responses:
        '201':
          description: Сохранённый результат команды; при повторе может быть историческим.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shelf'
              example:
                id: 00000000-0000-4000-8000-000000000004
                number: 1
                created_at: '2026-09-29T10:00:00Z'
                disabled_at: null
                cabinet_id: 00000000-0000-4000-8000-000000000003
        '400':
          $ref: '#/components/responses/Error400'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '413':
          $ref: '#/components/responses/Error413'
        '415':
          $ref: '#/components/responses/Error415'
        '422':
          $ref: '#/components/responses/Error422'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
      parameters:
      - name: cabinet_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateNumber'
            example:
              number: 1
    get:
      operationId: listShelfs
      tags:
      - Хранение
      summary: 'Список: полку'
      description: 'Список: полку'
      responses:
        '200':
          description: Успешное чтение.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShelfPage'
              example:
                items:
                - id: 00000000-0000-4000-8000-000000000004
                  number: 1
                  created_at: '2026-09-29T10:00:00Z'
                  disabled_at: null
                  cabinet_id: 00000000-0000-4000-8000-000000000003
                limit: 50
                offset: 0
        '400':
          $ref: '#/components/responses/Error400'
        '404':
          $ref: '#/components/responses/Error404'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
      parameters:
      - name: cabinet_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
  /shelves/{shelf_id}/cells:
    post:
      operationId: createCell
      tags:
      - Хранение
      summary: Создать ячейку
      description: Номер уникален внутри родителя (шкафа — глобально). Родитель должен существовать и быть активным;
        для ячейки активен и шкаф. Повтор с прежним ключом возвращает сохранённые статус и JSON без нового изменения.
        Ошибки ключ не сохраняют.
      responses:
        '201':
          description: Сохранённый результат команды; при повторе может быть историческим.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cell'
              example:
                id: 00000000-0000-4000-8000-000000000005
                number: 1
                created_at: '2026-09-29T10:00:00Z'
                disabled_at: null
                shelf_id: 00000000-0000-4000-8000-000000000004
                location_code: 1.1.1
        '400':
          $ref: '#/components/responses/Error400'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '413':
          $ref: '#/components/responses/Error413'
        '415':
          $ref: '#/components/responses/Error415'
        '422':
          $ref: '#/components/responses/Error422'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
      parameters:
      - name: shelf_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateNumber'
            example:
              number: 1
    get:
      operationId: listCells
      tags:
      - Хранение
      summary: 'Список: ячейку'
      description: 'Список: ячейку'
      responses:
        '200':
          description: Успешное чтение.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CellPage'
              example:
                items:
                - id: 00000000-0000-4000-8000-000000000005
                  number: 1
                  created_at: '2026-09-29T10:00:00Z'
                  disabled_at: null
                  shelf_id: 00000000-0000-4000-8000-000000000004
                  location_code: 1.1.1
                limit: 50
                offset: 0
        '400':
          $ref: '#/components/responses/Error400'
        '404':
          $ref: '#/components/responses/Error404'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
      parameters:
      - name: shelf_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
  /cells/{cell_id}/disable:
    post:
      operationId: disableCell
      tags:
      - Хранение
      summary: Отключить пустую ячейку
      description: Без тела запроса. Занятая ячейка — 409 CELL_OCCUPIED. Уже отключённая возвращает 200, время не
        меняется. История сохраняется. Повтор с прежним ключом возвращает сохранённые статус и JSON без нового изменения.
        Ошибки ключ не сохраняют.
      responses:
        '200':
          description: Сохранённый результат команды; при повторе может быть историческим.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cell'
              example:
                id: 00000000-0000-4000-8000-000000000005
                number: 1
                created_at: '2026-09-29T10:00:00Z'
                disabled_at: '2026-09-29T10:00:00Z'
                shelf_id: 00000000-0000-4000-8000-000000000004
                location_code: 1.1.1
        '400':
          $ref: '#/components/responses/Error400'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '413':
          $ref: '#/components/responses/Error413'
        '415':
          $ref: '#/components/responses/Error415'
        '422':
          $ref: '#/components/responses/Error422'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
      parameters:
      - name: cell_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IdempotencyKey'
  /cells/{cell_id}/batteries:
    get:
      operationId: listCellBatteries
      tags:
      - Хранение
      summary: 'Содержимое ячейки: 0 или 1 АКБ'
      description: 'Содержимое ячейки: 0 или 1 АКБ'
      responses:
        '200':
          description: Успешное чтение.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatteryPage'
              example:
                items:
                - id: 00000000-0000-4000-8000-000000000006
                  inventory_code: B-00412
                  status: STORED
                  current_cell_id: 00000000-0000-4000-8000-000000000005
                  current_holder_employee_id: null
                  version: 1
                  created_at: '2026-09-29T10:00:00Z'
                  updated_at: '2026-09-29T10:00:00Z'
                limit: 50
                offset: 0
        '400':
          $ref: '#/components/responses/Error400'
        '404':
          $ref: '#/components/responses/Error404'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
      parameters:
      - name: cell_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
  /batteries:
    post:
      operationId: storeBattery
      tags:
      - Учёт
      summary: 'STORE: зарегистрировать и разместить АКБ'
      description: Первая операция STORE, версия 1. Активное свободное назначение обязательно. Новая АКБ не может
        быть создана отдельно от размещения. Повтор с прежним ключом возвращает сохранённые статус и JSON без нового
        изменения. Ошибки ключ не сохраняют.
      responses:
        '201':
          description: Сохранённый результат команды; при повторе может быть историческим.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResult'
              example:
                operation:
                  id: 00000000-0000-4000-8000-000000000007
                  battery_id: 00000000-0000-4000-8000-000000000006
                  battery_version: 1
                  type: STORE
                  actor_employee_id: 00000000-0000-4000-8000-000000000001
                  credential_id: 00000000-0000-4000-8000-000000000002
                  device_code: TSD-07
                  source_cell_id: null
                  destination_cell_id: 00000000-0000-4000-8000-000000000005
