      description: Глобальный ключ успешной команды. Для повтора сохранить ключ и запрос.
      example: command-0001
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    Offset:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
