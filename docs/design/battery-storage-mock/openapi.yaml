components:
  schemas:
    Employee:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 200
        created_at:
          type: string
          format: date-time
        disabled_at:
          type: string
          format: date-time
          nullable: true
      required:
      - id
      - name
      - created_at
      - disabled_at
    Credential:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        employee_id:
          type: string
          format: uuid
        value:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[^\s\x00-\x1f\x7f]+$
        created_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
          nullable: true
      required:
      - id
      - employee_id
      - value
      - created_at
      - revoked_at
    CredentialResolution:
      type: object
      additionalProperties: false
      properties:
        employee_id:
          type: string
          format: uuid
        credential_id:
          type: string
          format: uuid
        name:
          type: string
      required:
      - employee_id
      - credential_id
      - name
    Cabinet:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        number:
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
        created_at:
          type: string
          format: date-time
        disabled_at:
          type: string
          format: date-time
          nullable: true
      required:
      - id
      - number
      - created_at
      - disabled_at
    Shelf:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        number:
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
        created_at:
          type: string
          format: date-time
        disabled_at:
          type: string
          format: date-time
          nullable: true
        cabinet_id:
          type: string
          format: uuid
      required:
      - id
      - number
      - created_at
      - disabled_at
      - cabinet_id
    Cell:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        number:
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
        created_at:
          type: string
          format: date-time
        disabled_at:
          type: string
          format: date-time
          nullable: true
        shelf_id:
          type: string
          format: uuid
        location_code:
          type: string
          description: Вычисляется из номеров шкафа, полки и ячейки; не PK.
      required:
      - id
      - number
      - created_at
      - disabled_at
      - shelf_id
      - location_code
    Battery:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        inventory_code:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[^\s\x00-\x1f\x7f]+$
        status:
          type: string
          enum:
          - STORED
          - ISSUED
        current_cell_id:
          type: string
          format: uuid
          nullable: true
        current_holder_employee_id:
          type: string
          format: uuid
          nullable: true
        version:
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - id
      - inventory_code
      - status
      - current_cell_id
      - current_holder_employee_id
      - version
      - created_at
      - updated_at
      description: 'STORED: cell задан, holder=null. ISSUED: cell=null, holder задан. Правило обеспечивается БД.'
    Operation:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        battery_id:
          type: string
          format: uuid
        battery_version:
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
        type:
          type: string
          enum:
          - STORE
          - TAKE
          - RETURN
          - MOVE
        actor_employee_id:
          type: string
          format: uuid
        credential_id:
          type: string
          format: uuid
        device_code:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[^\s\x00-\x1f\x7f]+$
          nullable: true
        source_cell_id:
