        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: UNAUTHENTICATED
              message: Зарезервировано для будущей аутентификации; в макете не используется
              details: {}
    Error403:
      description: Зарезервировано для будущих прав доступа; в макете не используется
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: FORBIDDEN
              message: Зарезервировано для будущих прав доступа; в макете не используется
              details: {}
    Error404:
      description: Ресурс или действующий credential не найден
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: RESOURCE_NOT_FOUND
              message: Ресурс или действующий credential не найден
              details: {}
    Error409:
