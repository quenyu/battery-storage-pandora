"components":
  "securitySchemes":
    "ApiBearer":
      "type": "http"
      "scheme": "bearer"
      "description": "Предложенный доверенный API principal/сеанс, без утверждения JWT/OIDC или конкретного issuer. Employee credential не заменяет token. Provider и права требуют Q19–20/Q25."
  "parameters":
    "IdempotencyKey":
      "name": "Idempotency-Key"
      "in": "header"
      "required": true
      "schema":
        "type": "string"
        "format": "uuid"
      "example": "00000000-0000-4000-8000-000000000801"
      "description": "UUID, созданный клиентом до первого запроса. Область — доверенный API principal. Тот же ключ/route/body возвращает исходный status/body; другое содержимое — 409. Хранение без автоочистки в MVP."
    "Limit":
      "name": "limit"
      "in": "query"
      "schema":
        "type": "integer"
        "minimum": 1
        "maximum": 200
        "default": 50
    "Cursor":
      "name": "cursor"
      "in": "query"
      "schema":
        "type": "string"
        "minLength": 1
      "description": "Непрозрачный курсор того же endpoint и фильтров; порядок описан в architecture.md."
    "employee_id":
      "name": "employee_id"
      "in": "path"
      "required": true
      "schema":
        "type": "string"
        "format": "uuid"
      "example": "00000000-0000-4000-8000-000000000137"
    "credential_id":
      "name": "credential_id"
      "in": "path"
      "required": true
      "schema":
        "type": "string"
        "format": "uuid"
      "example": "00000000-0000-4000-8000-000000000138"
    "battery_id":
      "name": "battery_id"
      "in": "path"
      "required": true
      "schema":
        "type": "string"
        "format": "uuid"
      "example": "00000000-0000-4000-8000-000000000412"
    "operation_id":
      "name": "operation_id"
      "in": "path"
      "required": true
      "schema":
        "type": "string"
        "format": "uuid"
      "example": "00000000-0000-4000-8000-000000000901"
  "responses":
    "Error400":
      "description": "Некорректный запрос"
      "content":
        "application/json":
          "schema":
            "$ref": "#/components/schemas/Error"
          "example":
            "error":
              "code": "INVALID_REQUEST"
              "message": "Некорректный запрос"
              "details": {}
              "request_id": "trace-example"
    "Error401":
      "description": "Требуется аутентификация"
      "content":
        "application/json":
          "schema":
            "$ref": "#/components/schemas/Error"
          "example":
            "error":
              "code": "UNAUTHENTICATED"
              "message": "Требуется аутентификация"
              "details": {}
              "request_id": "trace-example"
    "Error403":
      "description": "Действие не разрешено"
      "content":
        "application/json":
          "schema":
            "$ref": "#/components/schemas/Error"
          "example":
            "error":
              "code": "FORBIDDEN"
              "message": "Действие не разрешено"
              "details": {}
              "request_id": "trace-example"
    "Error404":
      "description": "Объект не найден"
      "content":
        "application/json":
          "schema":
            "$ref": "#/components/schemas/Error"
          "example":
            "error":
              "code": "RESOURCE_NOT_FOUND"
              "message": "Объект не найден"
              "details": {}
              "request_id": "trace-example"
    "Error409":
      "description": "Конфликт текущего состояния"
      "content":
        "application/json":
          "schema":
            "$ref": "#/components/schemas/Error"
          "example":
            "error":
              "code": "BATTERY_ALREADY_ISSUED"
              "message": "Конфликт текущего состояния"
              "details": {}
              "request_id": "trace-example"
    "Error422":
      "description": "Недопустимое значение"
      "content":
        "application/json":
          "schema":
            "$ref": "#/components/schemas/Error"
          "example":
            "error":
              "code": "VALIDATION_FAILED"
              "message": "Недопустимое значение"
              "details": {}
              "request_id": "trace-example"
    "Error500":
      "description": "Внутренняя ошибка"
      "content":
        "application/json":
          "schema":
            "$ref": "#/components/schemas/Error"
          "example":
            "error":
              "code": "INTERNAL_ERROR"
              "message": "Внутренняя ошибка"
              "details": {}
              "request_id": "trace-example"
    "Error503":
      "description": "Повторите запрос с тем же ключом"
      "content":
        "application/json":
          "schema":
            "$ref": "#/components/schemas/Error"
          "example":
            "error":
              "code": "TEMPORARILY_UNAVAILABLE"
              "message": "Повторите запрос с тем же ключом"
              "details": {}
              "request_id": "trace-example"
    "Error413":
      "description": "Тело запроса слишком велико"
      "content":
        "application/json":
          "schema":
            "$ref": "#/components/schemas/Error"
          "example":
            "error":
              "code": "PAYLOAD_TOO_LARGE"
              "message": "Тело запроса слишком велико"
              "details": {}
              "request_id": "trace-example"
    "Error415":
      "description": "Требуется application/json"
      "content":
        "application/json":
          "schema":
            "$ref": "#/components/schemas/Error"
          "example":
            "error":
              "code": "UNSUPPORTED_MEDIA_TYPE"
              "message": "Требуется application/json"
              "details": {}
              "request_id": "trace-example"
  "schemas":
    "Employee":
      "type": "object"
      "additionalProperties": false
      "properties":
        "id":
          "type": "string"
          "format": "uuid"
        "is_active":
          "type": "boolean"
        "created_at":
          "type": "string"
          "format": "date-time"
        "updated_at":
          "type": "string"
          "format": "date-time"
        "disabled_at":
          "type": "string"
          "format": "date-time"
          "nullable": true
        "display_name":
          "type": "string"
          "minLength": 1
        "personnel_number":
          "type": "string"
          "nullable": true
      "required":
        - "id"
        - "is_active"
        - "created_at"
        - "updated_at"
        - "disabled_at"
        - "display_name"
        - "personnel_number"
    "Credential":
      "type": "object"
      "additionalProperties": false
      "properties":
        "id":
          "type": "string"
          "format": "uuid"
        "is_active":
          "type": "boolean"
        "created_at":
          "type": "string"
          "format": "date-time"
        "updated_at":
          "type": "string"
          "format": "date-time"
        "disabled_at":
          "type": "string"
          "format": "date-time"
          "nullable": true
        "employee_id":
          "type": "string"
          "format": "uuid"
        "value":
          "type": "string"
          "minLength": 1
      "required":
        - "id"
        - "is_active"
        - "created_at"
        - "updated_at"
        - "disabled_at"
        - "employee_id"
        - "value"
    "Battery":
      "type": "object"
      "additionalProperties": false
      "properties":
        "id":
          "type": "string"
          "format": "uuid"
        "inventory_code":
          "type": "string"
          "minLength": 1
        "serial_number":
          "type": "string"
          "nullable": true
        "status":
          "type": "string"
          "enum":
            - "STORED"
            - "ISSUED"
        "current_location":
          "type": "string"
          "pattern": '^[1-9][0-9]*\.[1-9][0-9]*\.[1-9][0-9]*$'
          "nullable": true
          "minLength": 1
        "current_holder_employee_id":
          "type": "string"
          "format": "uuid"
          "nullable": true
        "version":
          "type": "integer"
          "format": "int64"
          "minimum": 1
        "created_at":
          "type": "string"
          "format": "date-time"
        "updated_at":
          "type": "string"
          "format": "date-time"
      "required":
        - "id"
        - "inventory_code"
        - "serial_number"
        - "status"
        - "current_location"
        - "current_holder_employee_id"
        - "version"
        - "created_at"
        - "updated_at"
      "description": "STORED: current_location заполнен, holder null. ISSUED: location null, holder заполнен. Current обновляется атомарно с immutable operation; полный replay на GET не нужен."
    "Operation":
      "type": "object"
      "additionalProperties": false
      "properties":
        "id":
          "type": "string"
          "format": "uuid"
        "battery_id":
          "type": "string"
          "format": "uuid"
        "battery_version":
          "type": "integer"
          "format": "int64"
          "minimum": 1
        "type":
          "type": "string"
          "enum":
            - "STORE"
            - "TAKE"
            - "RETURN"
            - "MOVE"
        "actor_employee_id":
          "type": "string"
          "format": "uuid"
        "credential_id":
          "type": "string"
          "format": "uuid"
        "source_status":
          "type": "string"
          "nullable": true
          "enum":
            - "STORED"
            - "ISSUED"
            - null
        "destination_status":
          "type": "string"
          "enum":
            - "STORED"
            - "ISSUED"
        "source_location":
          "type": "string"
          "pattern": '^[1-9][0-9]*\.[1-9][0-9]*\.[1-9][0-9]*$'
          "nullable": true
          "minLength": 1
        "destination_location":
          "type": "string"
          "pattern": '^[1-9][0-9]*\.[1-9][0-9]*\.[1-9][0-9]*$'
          "nullable": true
          "minLength": 1
        "source_holder_employee_id":
          "type": "string"
          "format": "uuid"
          "nullable": true
        "destination_holder_employee_id":
          "type": "string"
          "format": "uuid"
          "nullable": true
        "device_code":
          "type": "string"
          "nullable": true
          "minLength": 1
        "occurred_at":
          "type": "string"
          "format": "date-time"
      "required":
        - "id"
        - "battery_id"
        - "battery_version"
        - "type"
        - "actor_employee_id"
        - "credential_id"
        - "source_status"
        - "destination_status"
        - "source_location"
        - "destination_location"
        - "source_holder_employee_id"
        - "destination_holder_employee_id"
        - "device_code"
        - "occurred_at"
      "description": "Неизменяемый переход. Source/destination — текстовые адреса на момент оформления; source сервер берёт из current. Device code является меткой трассировки, не доказательством аппаратной аутентификации."
    "CommandResult":
      "type": "object"
      "additionalProperties": false
      "properties":
        "battery":
          "$ref": "#/components/schemas/Battery"
        "operation":
          "$ref": "#/components/schemas/Operation"
      "required":
        - "battery"
        - "operation"
    "CredentialResolution":
      "type": "object"
      "additionalProperties": false
      "properties":
        "employee":
          "$ref": "#/components/schemas/Employee"
        "credential_id":
          "type": "string"
          "format": "uuid"
      "required":
        - "employee"
        - "credential_id"
    "Error":
      "type": "object"
      "additionalProperties": false
      "properties":
        "error":
          "type": "object"
          "additionalProperties": false
          "properties":
            "code":
              "type": "string"
              "minLength": 1
            "message":
              "type": "string"
              "minLength": 1
            "details":
              "type": "object"
              "additionalProperties": true
            "request_id":
              "type": "string"
              "minLength": 1
          "required":
            - "code"
            - "message"
            - "details"
            - "request_id"
      "required":
        - "error"
    "CreateEmployee":
      "type": "object"
      "additionalProperties": false
      "properties":
        "display_name":
          "type": "string"
          "minLength": 1
        "personnel_number":
          "type": "string"
          "minLength": 1
      "required":
        - "display_name"
    "PatchEmployee":
      "type": "object"
      "additionalProperties": false
      "properties":
        "display_name":
          "type": "string"
          "minLength": 1
        "is_active":
          "type": "boolean"
      "required": []
      "minProperties": 1
    "ResolveCredential":
      "type": "object"
      "additionalProperties": false
      "properties":
        "credential_value":
          "type": "string"
          "minLength": 1
      "required":
        - "credential_value"
    "CreateCredential":
      "type": "object"
      "additionalProperties": false
      "properties":
        "value":
          "type": "string"
          "minLength": 1
        "replaces_credential_id":
          "type": "string"
          "format": "uuid"
      "required":
        - "value"
      "description": "Замена отключает только указанную карту того же сотрудника и создаёт новую в одной транзакции. Значение не нормализуется в число."
    "DisableCredential":
      "type": "object"
      "additionalProperties": false
      "properties":
        "is_active":
          "type": "boolean"
          "enum":
            - false
      "required":
        - "is_active"
    "StoreBattery":
      "type": "object"
      "additionalProperties": false
      "properties":
        "inventory_code":
          "type": "string"
          "minLength": 1
        "serial_number":
          "type": "string"
          "minLength": 1
        "actor_credential_value":
          "type": "string"
          "minLength": 1
        "destination_location":
          "type": "string"
          "pattern": '^[1-9][0-9]*\.[1-9][0-9]*\.[1-9][0-9]*$'
          "minLength": 1
      "required":
        - "inventory_code"
        - "actor_credential_value"
        - "destination_location"
    "TakeBattery":
      "type": "object"
      "additionalProperties": false
      "properties":
        "actor_credential_value":
          "type": "string"
          "minLength": 1
        "expected_version":
          "type": "integer"
          "format": "int64"
          "minimum": 1
        "observed_source_location":
          "type": "string"
          "pattern": '^[1-9][0-9]*\.[1-9][0-9]*\.[1-9][0-9]*$'
          "minLength": 1
      "required":
        - "actor_credential_value"
      "description": "Только STORED. Source определяется сервером под FOR UPDATE; observed_source_location только сверяется. Actor становится holder."
    "ReturnBattery":
      "type": "object"
      "additionalProperties": false
      "properties":
        "actor_credential_value":
          "type": "string"
          "minLength": 1
        "destination_location":
          "type": "string"
          "pattern": '^[1-9][0-9]*\.[1-9][0-9]*\.[1-9][0-9]*$'
          "minLength": 1
        "expected_version":
          "type": "integer"
          "format": "int64"
          "minimum": 1
      "required":
        - "actor_credential_value"
        - "destination_location"
      "description": "Возврат разрешён только текущему держателю: сравниваются employee.id, а не значения карты. Для другого сотрудника 403 RETURN_NOT_ALLOWED."
    "MoveBattery":
      "type": "object"
      "additionalProperties": false
      "properties":
        "actor_credential_value":
          "type": "string"
          "minLength": 1
        "destination_location":
          "type": "string"
          "pattern": '^[1-9][0-9]*\.[1-9][0-9]*\.[1-9][0-9]*$'
          "minLength": 1
        "expected_version":
          "type": "integer"
          "format": "int64"
          "minimum": 1
        "observed_source_location":
          "type": "string"
          "pattern": '^[1-9][0-9]*\.[1-9][0-9]*\.[1-9][0-9]*$'
          "minLength": 1
      "required":
        - "actor_credential_value"
        - "destination_location"
    "EmployeePage":
      "type": "object"
      "additionalProperties": false
      "properties":
        "items":
          "type": "array"
          "items":
            "$ref": "#/components/schemas/Employee"
        "next_cursor":
          "type": "string"
          "nullable": true
      "required":
        - "items"
        - "next_cursor"
    "CredentialPage":
      "type": "object"
      "additionalProperties": false
      "properties":
        "items":
          "type": "array"
          "items":
            "$ref": "#/components/schemas/Credential"
        "next_cursor":
          "type": "string"
          "nullable": true
      "required":
        - "items"
        - "next_cursor"
    "BatteryPage":
      "type": "object"
      "additionalProperties": false
      "properties":
        "items":
          "type": "array"
          "items":
            "$ref": "#/components/schemas/Battery"
        "next_cursor":
          "type": "string"
          "nullable": true
      "required":
        - "items"
        - "next_cursor"
    "OperationPage":
      "type": "object"
      "additionalProperties": false
      "properties":
        "items":
          "type": "array"
          "items":
            "$ref": "#/components/schemas/Operation"
        "next_cursor":
          "type": "string"
          "nullable": true
      "required":
        - "items"
        - "next_cursor"
