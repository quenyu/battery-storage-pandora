# Design draft after manager decision. Endpoint table: architecture.md
"openapi": "3.0.3"
"info":
  "title": "Pandora Battery Storage & Traceability — MVP API v1"
  "version": "1.1.0"
  "description": "Обновлённый проект по решению руководителя: шкафы, полки, ячейки отдельными таблицами не ведутся. Адреса — текстовые source_location/destination_location в immutable журнале и current_location в текущей проекции. Одна АКБ на точный канонический адрес; формат адреса: три положительных числа шкаф.полка.ячейка без ведущих нулей. У строк нет FK на существующие места, нет управления пустыми/отключёнными местами. RETURN только взявшим сотрудником. Детальный клиент ТСД/offline вне этапа. Device code — необязательная серверная метка, без справочника устройств. POST/PATCH изменения требуют Idempotency-Key, lookup read-only без ключа. Четыре domain таблицы плюс техническая idempotency_requests. Authentication provider и источник сотрудников ещё не подтверждены. Этот YAML встроен в новый MVP backend. Локальный режим использует явно заданный Bearer test token."
"servers":
  -
    "url": "/api/v1"
    "description": "Тот же origin, что и Swagger UI"
"security":
  -
    "ApiBearer": []
"tags":
