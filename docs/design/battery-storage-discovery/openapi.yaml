          "in": "query"
          "schema":
            "type": "string"
            "pattern": '^[1-9][0-9]*\.[1-9][0-9]*\.[1-9][0-9]*$'
            "minLength": 1
          "description": "Точный текстовый адрес. В batteries — current_location, в operations — source OR destination. Не подтверждает существование места."
    "post":
      "operationId": "storeNewBattery"
      "tags":
        - "Commands"
      "summary": "Зарегистрировать и разместить АКБ"
      "description": "Атомарный реестр + STORE version=1. destination_location непустая, без крайних пробелов, должна быть свободна по UNIQUE. Формат адреса: три положительных числа через точку без ведущих нулей. Существование физического места не проверяется справочником. 409 INVENTORY_CODE_EXISTS/LOCATION_OCCUPIED."
